<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<title>馬會亞指推薦板</title>
<style>
:root {
  --bg:#0f1419; --card:#1a2332; --card2:#243044; --text:#e7ecf3; --muted:#8b9bb4;
  --accent:#3d8bfd; --good:#3dd68c; --warn:#f5a524; --skip:#6b7c93; --bad:#f07178;
  --border:#2a3a52; --chip:#1e2d42;
}
* { box-sizing:border-box; }
body {
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC",
    "Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.45;
  min-height:100vh;
}
.wrap { max-width:960px; margin:0 auto; padding:16px 14px 48px; }
header { margin-bottom:14px; }
h1 { font-size:1.3rem; margin:0 0 6px; font-weight:700; letter-spacing:.02em; }
.disclaimer { color:var(--muted); font-size:.82rem; margin:0 0 8px; }
.meta { color:var(--muted); font-size:.8rem; display:flex; flex-wrap:wrap; gap:8px 14px; }
.meta strong { color:var(--text); font-weight:600; }
.tabs {
  display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 12px; position:sticky; top:0;
  background:rgba(15,20,25,.92); backdrop-filter:blur(8px); padding:10px 0; z-index:5;
}
.tab {
  border:1px solid var(--border); background:var(--chip); color:var(--text);
  border-radius:999px; padding:7px 14px; font-size:.85rem; cursor:pointer;
}
.tab.active { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
.tab:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.empty { color:var(--muted); text-align:center; padding:40px 12px; }
.card {
  background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:14px 14px 12px; margin-bottom:12px;
}
.card.has-ticket { border-color:#2d5a3d; box-shadow:inset 3px 0 0 var(--good); }
.card.settled-win { box-shadow:inset 3px 0 0 var(--good); }
.card.settled-loss { box-shadow:inset 3px 0 0 var(--bad); }
.row1 {
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px;
  margin-bottom:6px; font-size:.82rem; color:var(--muted);
}
.mins {
  font-weight:700; font-size:.72rem; letter-spacing:.02em;
  padding:3px 8px; border-radius:6px; background:var(--chip); color:var(--warn);
  border:1px solid var(--border);
}
.teams { font-size:1.05rem; font-weight:700; color:var(--text); margin:2px 0 6px; }
.league { color:var(--muted); font-weight:500; font-size:.8rem; }
.hkjc {
  font-size:.78rem; color:var(--muted); margin:0 0 8px; word-break:break-word;
}
.move {
  font-size:.82rem; color:var(--warn); margin:0 0 8px; line-height:1.4;
}
.block {
  background:var(--card2); border:1px solid var(--border); border-radius:10px;
  padding:10px 10px 8px; margin-top:4px;
}
.main {
  font-size:1.08rem; font-weight:800; margin:2px 0 2px;
  color:var(--good); word-break:break-word;
}
.main.skip { color:var(--skip); font-weight:700; font-size:.98rem; }
.naruto {
  font-size:.92rem; color:var(--warn); margin:0 0 6px; font-weight:600;
}
.sides { display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 4px; }
.chip {
  background:var(--bg); border:1px solid var(--border); border-radius:8px;
  padding:4px 8px; font-size:.75rem; color:var(--muted);
}
.chip b { color:var(--text); font-weight:600; margin-right:4px; }
.fupan {
  margin-top:8px; padding:8px 10px; border-radius:8px;
  background:rgba(61,139,253,.08); border:1px solid var(--border);
  font-size:.88rem;
}
.fupan .score { font-weight:800; font-size:1.05rem; margin-right:8px; }
.fupan .res-win, .fupan .res-half_win { color:var(--good); font-weight:700; }
.fupan .res-loss, .fupan .res-half_loss { color:var(--bad); font-weight:700; }
.fupan .res-push { color:var(--muted); font-weight:700; }
.fupan .pending { color:var(--muted); }
.fupan .meta-line { color:var(--muted); font-size:.75rem; margin-top:4px; }
details.history {
  margin-top:8px; font-size:.8rem; color:var(--muted);
}
details.history summary {
  cursor:pointer; color:var(--muted); padding:4px 0; user-select:none;
}
details.history summary:hover { color:var(--text); }
.hist-item {
  border-top:1px dashed var(--border); padding:8px 0 4px; margin-top:4px;
}
.hist-tag {
  font-size:.7rem; color:var(--muted); opacity:.85; margin-bottom:4px;
}
.foot {
  margin-top:28px; color:var(--muted); font-size:.75rem; text-align:center;
}
@media (max-width:520px) {
  h1 { font-size:1.12rem; }
  .main { font-size:1.0rem; }
  .teams { font-size:.98rem; }
}
</style>
</head>

<script>
(function () {
  var raw = document.getElementById('board-data').textContent;
  var data = JSON.parse(raw);
  var upcoming = data.upcoming || [];
  var history = data.history || [];
  var tab = 'upcoming';

  document.getElementById('updatedAt').textContent = data.updated_at_hkt || '—';
  document.getElementById('upcomingCount').textContent = String(data.upcoming_count || upcoming.length);
  document.getElementById('historyCount').textContent = String(data.history_count || history.length);
  document.getElementById('settledCount').textContent = String(data.settled_count || 0);

  function esc(s) {
    if (s == null || s === '') return '';
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function isSkipMain(main) {
    if (!main) return true;
    return /跳過|NO-BET|HOLD|無向|無(?=\s|$)|不出|待出/i.test(main);
  }

  function sideChips(t) {
    if (!t) return '';
    var keys = [
      ['大小參考', t['九尾']],
      ['街貨參考A', t['卡卡西']],
      ['街貨參考B', t['佐助']]
    ];
    var html = '';
    keys.forEach(function (kv) {
      var v = kv[1];
      if (!v || v === '—' || v === '无' || v === '無') return;
      html += '<span class="chip"><b>' + esc(kv[0]) + '</b>' + esc(v) + '</span>';
    });
    return html;
  }

  function renderAnalysis(t, pendingMsg, matchMove) {
    if (!t) {
      var move0 = matchMove ? ('<div class="move">盤口變化：' + esc(matchMove) + '</div>') : '';
      return '<div class="block">' + move0 + '<div class="main skip">' + esc(pendingMsg || '待出票') + '</div></div>';
    }
    var main = t['主方向'] || '—';
    var skip = isSkipMain(main);
    var chips = sideChips(t);
    var move = t['盤口變化'] || matchMove;
    var hk = t['馬會'] ? ('馬會現況：' + t['馬會']) : '';
    var ul = '';
    if (t.upper || t.lower) {
      ul = '<div class="hkjc">上盤 ' + esc(t.upper || '—') + '　下盤 ' + esc(t.lower || '—') + '</div>';
    }
    var parallel = t['平行參考'] || t['鳴人'] || '—';
    return (
      '<div class="block">' + ul +
        (move ? '<div class="move">盤口變化：' + esc(move) + '</div>' : '') +
        '<div class="main' + (skip ? ' skip' : '') + '">【主方向】' + esc(main) + '</div>' +
        '<div class="naruto">【平行參考】' + esc(parallel) + '</div>' +
        (chips ? '<div class="sides">' + chips + '</div>' : '') +
        (hk ? '<div class="hkjc">' + esc(hk) + '</div>' : '') +
      '</div>'
    );
  }

  function renderFupan(fp) {
    if (!fp) return '';
    if (!fp.score) {
      return '<div class="fupan"><span class="pending">' + esc(fp.label || '覆盤：待賽果') + '</span></div>';
    }
    var body = '<span class="score">' + esc(fp.score) + '</span>';
    if (fp['主方向'] && fp['主方向'].result_zh) {
      body += '主方向 <span class="res-' + esc(fp['主方向'].result) + '">' +
        esc(fp['主方向'].result_zh) + '</span>';
      if (fp['主方向'].side) body += '（' + esc(fp['主方向'].side) + '）';
    } else if (fp.label) {
      body += '<span class="pending">' + esc(fp.label.replace(/^覆盤：\d+-\d+\s*/, '') || '') + '</span>';
    }
    if (fp['鳴人'] && fp['鳴人'].result_zh) {
      body += '　平行參考 <span class="res-' + esc(fp['鳴人'].result) + '">' +
        esc(fp['鳴人'].result_zh) + '</span>';
    }
    var meta = fp.line_used ? ('<div class="meta-line">結算盤：' + esc(fp.line_used) + '</div>') : '';
    return '<div class="fupan">' + body + meta + '</div>';
  }

  function renderHistoryTrail(analyses) {
    if (!analyses || analyses.length <= 1) return '';
    var items = analyses.map(function (a) {
      var tag = a.window_tag || '';
      var main = a['主方向'] || '—';
      var para = a['平行參考'] || a['鳴人'] || '—';
      return (
        '<div class="hist-item">' +
          (tag ? '<div class="hist-tag">' + esc(tag) + '</div>' : '') +
          '<div>【主方向】' + esc(main) + '</div>' +
          '<div>【平行參考】' + esc(para) + '</div>' +
          (a['盤口變化'] ? '<div class="move">' + esc(a['盤口變化']) + '</div>' : '') +
        '</div>'
      );
    }).join('');
    return (
      '<details class="history">' +
        '<summary>分析歷程（' + analyses.length + '）</summary>' +
        items +
      '</details>'
    );
  }

  function renderUpcoming(m) {
    var has = !!m.has_main_ticket;
    var league = m.league ? '<span class="league"> · ' + esc(m.league) + '</span>' : '';
    var mins = (m.minutes_to_kick != null)
      ? '<span class="mins">T−' + esc(String(Math.max(0, Math.round(m.minutes_to_kick)))) + 'm</span>'
      : '';
    var hk = m.hkjc_line ? ('馬會：' + m.hkjc_line) : '馬會：—（來源無尾盤數）';
    return (
      '<article class="card' + (has ? ' has-ticket' : '') + '">' +
        '<div class="row1">' +
          mins +
          '<span>' + esc(m.kickoff_hkt || '') + '</span>' +
          league +
        '</div>' +
        '<div class="teams">' + esc(m.home) + ' vs ' + esc(m.away) + '</div>' +
        '<div class="hkjc">' + esc(hk) + '</div>' +
        renderAnalysis(m.ticket, '待出票', m['盤口變化'] || null) +
      '</article>'
    );
  }

  function settledClass(fp) {
    if (!fp || !fp['主方向']) return '';
    var r = fp['主方向'].result || '';
    if (r === 'win' || r === 'half_win') return ' settled-win';
    if (r === 'loss' || r === 'half_loss') return ' settled-loss';
    return '';
  }

  function renderHistory(m) {
    var has = !!m.has_main_ticket;
    var league = m.league ? '<span class="league"> · ' + esc(m.league) + '</span>' : '';
    var fp = m['覆盤'] || {};
    return (
      '<article class="card' + (has ? ' has-ticket' : '') + settledClass(fp) + '">' +
        '<div class="row1">' +
          '<span>' + esc(m.kickoff_hkt || '') + '</span>' +
          league +
        '</div>' +
        '<div class="teams">' + esc(m.home) + ' vs ' + esc(m.away) + '</div>' +
        renderAnalysis(m.latest) +
        renderFupan(fp) +
        renderHistoryTrail(m.analyses) +
      '</article>'
    );
  }

  function render() {
    var el = document.getElementById('board');
    if (tab === 'upcoming') {
      if (!upcoming.length) {
        el.innerHTML = '<p class="empty">未來 12 小時暫無馬會讓球賽事</p>';
        return;
      }
      el.innerHTML = upcoming.map(renderUpcoming).join('');
    } else {
      if (!history.length) {
        el.innerHTML = '<p class="empty">暫無歷史出票</p>';
        return;
      }
      el.innerHTML = history.map(renderHistory).join('');
    }
  }

  document.querySelectorAll('.tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      tab = btn.getAttribute('data-tab');
      document.querySelectorAll('.tab').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
