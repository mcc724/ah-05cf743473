<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>鳴人專案 賽程／動向 Live</title>
<style>
body { font-family: Arial, sans-serif; background:#111; color:#eee; padding:10px; }
h1 { color:#0f0; }
.col { display:inline-block; vertical-align:top; width:32%; margin:0.5%; background:#222; padding:10px; border-radius:8px; }
.card { background:#333; margin:8px 0; padding:8px; border-left:4px solid #0f0; }
.time { color:#aaa; font-size:0.9em; }
.fb { color:#ff0; }
.line { color:#0ff; }
.trend { color:#f90; }
.naruto { color:#0f0; font-weight:bold; }
.deer { color:#f0f; }
.suggest { color:#fff; }
</style>
</head>
<body>
<h1>鳴人專案 賽程／動向 (暫代) - 更新 18:10 HKT</h1>
<div id="meta"></div>
<div class="col"><h2>即將</h2><div id="upcoming"></div></div>
<div class="col"><h2>已開賽</h2><div id="live"></div></div>
<div class="col"><h2>已完結</h2><div id="finished"></div></div>
<script>
fetch('board_live.json').then(r=>r.json()).then(data=>{
  document.getElementById('meta').innerHTML = '更新: ' + data.updated;
  function render(id, list){
    const el = document.getElementById(id);
    el.innerHTML = list.map(m => `
      <div class="card">
        <div class="time">${m.time} <span class="fb">${m.fb}</span></div>
        <div>${m.home} vs ${m.away}</div>
        <div class="line">盤口 ${m.line} 主水 ${m.home_w} / 客水 ${m.away_w}</div>
        <div class="trend">動向: ${m.trend}</div>
        <div class="naruto">【鳴人】${m.naruto} (conf ${m.conf}%)</div>
        <div class="deer">【鹿丸】${m.deer}</div>
        <div class="suggest">【跟盤建議】${m.suggest}</div>
      </div>
    `).join('');
  }
  render('upcoming', data.upcoming||[]);
  render('live', data.live||[]);
  render('finished', data.finished||[]);
});
</script>
</body>
</html>
