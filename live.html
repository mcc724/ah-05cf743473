<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>讓球動向 live</title>
<style>
body{margin:0;background:#0e1412;color:#e8efe9;font:15px/1.45 -apple-system,PingFang HK,sans-serif}
header{padding:16px 18px;background:#14201b;border-bottom:1px solid #244036}
h1{margin:0 0 6px;font-size:20px}.sub{color:#9fb5a8;font-size:13px}
main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px}
@media(max-width:980px){main{grid-template-columns:1fr}}
section{background:#121a17;border:1px solid #24362d;border-radius:10px;padding:10px}
h2{margin:4px 8px 10px;font-size:16px}
.card{background:#1a2620;border-radius:8px;padding:10px 12px;margin:0 0 8px}
.meta{color:#8aa394;font-size:12px}h3{margin:4px 0;font-size:16px}
.odds{color:#d7c27a}.move{color:#9ec7ff;font-size:13px;margin:4px 0}
.dir{font-size:14px;margin:2px 0}.fol{color:#b7e3c4}
</style></head><body>
<header><h1>讓球賽程／動向</h1><p class="sub" id="sub">載入中</p></header>
<main id="main"></main>
<script>
fetch('board_live.json').then(r=>r.json()).then(b=>{
  document.getElementById('sub').textContent='更新 '+b.updated_at_hkt+' · 即將 '+(b.counts['即將']||0)+' · 已開賽 '+(b.counts['已開賽']||0)+' · 已完結 '+(b.counts['已完結']||0)+' · 層1 v28 · 鹿丸只抄 tickets，無則缺 · 已開不改舊票';
  const cols={即將:[],已開賽:[],已完結:[]};
  for(const m of b.matches){
    const line=m.line==null?'讓球暫停':('盤 '+(m.line>0?'+':'')+m.line+'　主水 '+(m.home_water??'—')+'　客水 '+(m.away_water??'—'));
    const sc=m.score?('　FT '+m.score):'';
    cols[m.status].push('<article class="card"><div class="meta">'+m.ko.slice(5)+' · '+m.league+' · '+m.fb+sc+'</div><h3>'+m.home+' vs '+m.away+'</h3><div class="odds">'+line+'</div><div class="move">動向 '+m.move+'</div><div class="dir"><b>【鳴人】</b> '+m.naruto+'</div><div class="dir"><b>【鹿丸】</b> '+(m.shikamaru||'缺')+'</div><div class="dir fol"><b>【跟盤建議】</b> '+m.follow+'</div></article>');
  }
  document.getElementById('main').innerHTML=['即將','已開賽','已完結'].map(k=>'<section><h2>'+k+'（'+cols[k].length+'）</h2>'+cols[k].join('')+'</section>').join('');
});
</script></body></html>
