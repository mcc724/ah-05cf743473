<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>鳴人專案 賽程／動向 Live</title>
<style>
body { font-family: Arial, sans-serif; background:#111; color:#eee; padding:10px; }
h2 { color:#4af; }
.card { background:#222; border:1px solid #444; margin:8px; padding:10px; border-radius:6px; }
.fb { color:#fa0; font-weight:bold; }
.naruto { color:#0f0; }
.suggest { color:#ff0; }
.trend { color:#aaa; font-size:0.9em; }
</style>
</head>
<body>
<h1>鳴人專案 HKJC 讓球 賽程／動向</h1>
<p>更新：2026-11-08 19:10 HKT | <a href="board_live.json" style="color:#4af">board_live.json</a></p>
<h2>即將</h2>
<div id="upcoming"></div>
<h2>已開賽</h2>
<div id="live"></div>
<h2>已完結</h2>
<div id="finished"></div>
<script>
fetch('board_live.json').then(r=>r.json()).then(data => {
  function render(id, list) {
    const el = document.getElementById(id);
    el.innerHTML = list.map(m => `
      <div class="card">
        <div><span class="fb">${m.fb}</span> ${m.time} ${m.home} vs ${m.away} ${m.score||''}</div>
        <div>盤口 ${m.line||''} 主水 ${m.home_w||''} 客水 ${m.away_w||''}</div>
        <div class="trend">動向：${m.trend}</div>
        <div class="naruto">【鳴人】${m.naruto} ${m.conf? '('+m.conf+'%)':''}</div>
        <div>【鹿丸】${m.deer}</div>
        <div class="suggest">【跟盤建議】${m.suggest}</div>
      </div>
    `).join('');
  }
  render('upcoming', data.upcoming||[]);
  render('live', data.live||[]);
  render('finished', data.finished||[]);
});
</script>
</body>
</html>
