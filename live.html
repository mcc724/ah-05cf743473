<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>賽程動向 live</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#0f1419;color:#e7ecf1;margin:0;padding:16px}
h1{font-size:20px;margin:0 0 6px}
.meta{color:#9aa7b2;font-size:13px;margin-bottom:14px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
section{background:#1a222b;border-radius:12px;padding:10px}
section h2{margin:0 0 8px;font-size:16px}
.card{background:#12181f;border:1px solid #2a3642;border-radius:10px;padding:10px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;color:#8ec8ff;font-size:12px}
.lg{color:#9aa7b2;font-size:12px}
h3{margin:4px 0;font-size:15px}
.line,.mv{font-size:13px;margin:2px 0}
.mv{color:#f0c674}
.dir{font-size:13px;margin:2px 0}
.n{color:#8f8}.s{color:#9cf}.f{color:#fc8}.sc{color:#f88;font-size:13px}
a{color:#8ec8ff}
</style>
</head>
<body>
<h1>今晚＋明日讓球動向</h1>
<div class="meta" id="meta">載入中…</div>
<div class="cols">
<section><h2 id="h1">即將</h2><div id="c1"></div></section>
<section><h2 id="h2">已開賽</h2><div id="c2"></div></section>
<section><h2 id="h3">已完結</h2><div id="c3"></div></section>
</div>
<script>
function esc(s){return String(s==null?"—":s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function card(m){
  const line = m.line==null ? "暫停" : ("主盤 "+m.line+"　主水 "+Number(m.home_water).toFixed(2)+"　客水 "+Number(m.away_water).toFixed(2));
  const sc = m.score ? '<div class="sc">'+esc(m.score)+'</div>' : "";
  return '<article class="card"><div class="top"><span class="ko">'+esc((m.ko||"").slice(5))+'</span><span class="fb">'+esc(m.fb)+'</span></div><div class="lg">'+esc(m.league)+'</div><h3>'+esc(m.home)+' vs '+esc(m.away)+'</h3>'+sc+'<div class="line">'+esc(line)+'</div><div class="mv">動向：'+esc(m.move)+'</div><div class="dir n">【鳴人】'+esc(m.naruto)+'</div><div class="dir s">【鹿丸】'+esc(m.shikamaru)+'</div><div class="dir f">【跟盤建議】'+esc(m.follow)+'</div></article>';
}
fetch("board_live.json?v=202610032109").then(r=>r.json()).then(p=>{
  const c=p.counts||{};
  document.getElementById("meta").innerHTML="更新 "+esc(p.updated_at_hkt)+" · 即將 "+(c["即將"]||0)+" · 已開賽 "+(c["已開賽"]||0)+" · 已完結 "+(c["已完結"]||0)+"<br/>"+esc(p.note)+'<br/><a href="board_live.json">board_live.json</a> · <a href="index.html">主板</a>';
  const bins={"即將":[],"已開賽":[],"已完結":[]};
  (p.matches||[]).forEach(m=>{ (bins[m.status]||bins["即將"]).push(card(m)); });
  if(!bins["已完結"].length) bins["已完結"].push("<p>本輪無 FT 大分，不捏造。</p>");
  document.getElementById("h1").textContent="即將 "+(c["即將"]||0);
  document.getElementById("h2").textContent="已開賽 "+(c["已開賽"]||0);
  document.getElementById("h3").textContent="已完結 "+(c["已完結"]||0);
  document.getElementById("c1").innerHTML=bins["即將"].join("");
  document.getElementById("c2").innerHTML=bins["已開賽"].join("");
  document.getElementById("c3").innerHTML=bins["已完結"].join("");
});
</script>
</body></html>
