<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>馬會亞指即時賽程</title>
<style>body{font-family:sans-serif;background:#0f1419;color:#e7ecf3;margin:16px;line-height:1.45}a{color:#3d8bfd}.card{background:#1a2332;border:1px solid #2a3a52;border-radius:12px;padding:12px;margin:0 0 10px}.ko{color:#f5a524;font-weight:700}.mv{color:#8b9bb4}</style>
</head><body>
<h1>馬會亞指 · 即時賽程／動向</h1>
<p>Pages=<b>master</b> · <a href="./">主板</a> · <a href="./board_live.json">board_live.json</a></p>
<div id="app">載入中…</div>
<script>
fetch("./board_live.json?ts="+Date.now()).then(r=>r.json()).then(d=>{
  const c=d.counts||{};
  const esc=s=>String(s??"").replace(/[&<>]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[ch]));
  let h="<p>更新 "+esc(d.updated_at_hkt)+" · 即將 "+esc(c["即將"])+" · 已開賽 "+esc(c["已開賽"])+" · 已完結 "+esc(c["已完結"])+" · 已開不改舊票</p>";
  h+="<p class='mv'>"+esc(d.note||"")+"</p>";
  h+="<div class='card'><div class='ko'>本輪新出</div><div>"+esc((d.new_directions||[]).join("；")||"無")+"</div></div>";
  h+="<div class='card'><div class='ko'>本輪重出</div><div>"+esc((d.reissued||[]).join("；")||"無")+"</div></div>";
  h+="<div class='card'><div class='ko'>已開賽（不改舊票）</div><div>"+esc((d.inplay||[]).join("；"))+"</div></div>";
  h+="<div class='card'><div class='ko'>新完場</div><div>"+esc((d.ft_new||[]).join("；"))+"</div></div>";
  document.getElementById("app").innerHTML=h;
}).catch(e=>{document.getElementById("app").textContent="載入失敗 "+e;});
</script></body></html>
