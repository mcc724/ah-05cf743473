<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>鳴人專案 賽程／動向 Live</title>
<style>
body { font-family: sans-serif; background:#111; color:#eee; }
.card { border:1px solid #444; margin:8px; padding:10px; border-radius:8px; background:#222; }
.time { color:#8cf; }
.trend { color:#fc8; }
.naruto { color:#6f6; font-weight:bold; }
.deer { color:#f96; }
.suggest { color:#6cf; }
</style>
</head>
<body>
<h1>鳴人專案 今晚＋明日 讓球 Live <span id="upd"></span></h1>
<div id="upcoming"></div>
<div id="live"></div>
<div id="finished"></div>
<script>
fetch('board_live.json').then(r=>r.json()).then(d=>{
  document.getElementById('upd').textContent = d.updated;
  function render(id, list, title) {
    const el = document.getElementById(id);
    el.innerHTML = `<h2>${title} (${list.length})</h2>`;
    list.forEach(m => {
      el.innerHTML += `<div class="card">
        <div class="time">${m.time} ${m.fb}</div>
        <div>${m.home} vs ${m.away}</div>
        <div>盤口 ${m.line} 主水 ${m.home_w} / 客水 ${m.away_w}</div>
        <div class="trend">動向：${m.trend}</div>
        <div class="naruto">【鳴人】${m.naruto} (${m.conf}%)</div>
        <div class="deer">【鹿丸】${m.deer}</div>
        <div class="suggest">【跟盤建議】${m.suggest}</div>
      </div>`;
    });
  }
  render('upcoming', d.upcoming, '即將');
  render('live', d.live, '已開賽');
  render('finished', d.finished, '已完結');
});
</script>
</body>
</html>
