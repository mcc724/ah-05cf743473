<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>鳴人暫代賽程 live</title>
<style>
body { font-family: sans-serif; background:#111; color:#eee; padding:10px; }
h1 { color:#0f0; }
.section { margin:20px 0; }
.card { border:1px solid #444; margin:8px 0; padding:8px; background:#222; border-radius:6px; }
.fb { color:#0af; font-weight:bold; }
.naruto { color:#0f0; }
.deer { color:#fa0; }
.suggest { color:#fff; }
.trend { color:#aaa; font-size:0.9em; }
</style>
</head>
<body>
<h1>鳴人暫代 HKJC 賽程／動向</h1>
<p>更新：2026-11-14 20:10 HKT | 公開 https://mcc724.github.io/ah-05cf743473/live.html</p>
<div id="app"></div>
<script>
fetch('board_live.json').then(r=>r.json()).then(data=>{
  const app = document.getElementById('app');
  const secs = [
    {key:'upcoming', title:'即將開賽'},
    {key:'live', title:'已開賽（不改票）'},
    {key:'finished', title:'已完結'}
  ];
  secs.forEach(s=>{
    const div = document.createElement('div');
    div.className='section';
    div.innerHTML = `<h2>${s.title} (${data[s.key].length}場)</h2>`;
    data[s.key].forEach(m=>{
      const c = document.createElement('div');
      c.className='card';
      c.innerHTML = `
        <div class="fb">${m.fb} ${m.time} ${m.home} vs ${m.away}</div>
        <div>盤口 ${m.line} 主水 ${m.home_w} / 客水 ${m.away_w}</div>
        <div class="trend">動向：${m.trend}</div>
        <div class="naruto">【鳴人】${m.naruto} conf ${m.conf}%</div>
        <div class="deer">【鹿丸】${m.deer}</div>
        <div class="suggest">【跟盤建議】${m.suggest}</div>
      `;
      div.appendChild(c);
    });
    app.appendChild(div);
  });
});
</script>
</body>
</html>
