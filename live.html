<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>鳴人專案 賽程／動向 Live</title>
<style>
body { font-family: system-ui, sans-serif; background:#111; color:#eee; margin:20px; }
h1 { color:#0f0; }
h2 { border-bottom:1px solid #444; padding-bottom:8px; }
.card { background:#222; border:1px solid #444; border-radius:8px; padding:12px; margin:10px 0; }
.fb { color:#0af; font-weight:bold; }
.line { color:#fa0; }
.naruto { color:#0f0; font-weight:bold; }
.suggest { color:#ff0; }
.trend { color:#aaa; font-size:0.9em; }
.updated { color:#888; }
</style>
</head>
<body>
<h1>鳴人專案 賽程／動向</h1>
<p class="updated">更新時間：2026-11-20 22:18 HKT　（暫代）</p>
<p>公開：<a href="https://mcc724.github.io/ah-05cf743473/live.html" style="color:#0af">live.html</a></p>
<h2>即將（KO 未到）</h2>
<div id="upcoming"></div>
<h2>已開賽（KO 已過，未有 FT）</h2>
<div id="in_progress"></div>
<h2>已完結</h2>
<div id="finished"></div>
<script>
fetch('board_live.json').then(r=>r.json()).then(data=>{
function render(arr, id) {
  const el = document.getElementById(id);
  el.innerHTML = arr.map(m => `
    <div class="card">
      <div><span class="fb">${m.fb}</span> ${m.ko}　${m.match}</div>
      <div class="line">盤口 ${m.line}　主水 ${m.wh||''} / 客水 ${m.wa||''}</div>
      <div class="trend">動向：${m.trend}</div>
      <div class="naruto">【鳴人】${m.naruto}</div>
      <div>【鹿丸】${m.shikamaru}</div>
      <div class="suggest">【跟盤建議】${m.suggest}</div>
    </div>
  `).join('') || '<p>無</p>';
}
render(data.upcoming, 'upcoming');
render(data.in_progress, 'in_progress');
render(data.finished, 'finished');
}).catch(e=>{document.body.innerHTML+='<p>load error</p>';});
</script>
</body>
</html>
