<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<title>馬會亞指 · 即時賽程／動向</title>
<!-- board sync 2026-10-02 18:06 HKT; cards read board_live.json -->
<style>
:root{--bg:#0f1419;--card:#1a2332;--text:#e7ecf3;--muted:#8b9bb4;--accent:#3d8bfd;--good:#3dd68c;--warn:#f5a524;--bad:#f07178;--border:#2a3a52}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 48px}
h1{font-size:1.2rem;margin:0 0 6px} h2{font-size:1rem;margin:18px 0 8px}
.meta{color:var(--muted);font-size:.82rem;margin:0 0 12px}a{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin:0 0 10px}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ko{color:var(--warn);font-weight:700} .fb{color:var(--muted);font-size:.78rem}
.line{font-size:.95rem;margin-top:6px} .mv{font-size:.82rem;color:var(--muted);margin-top:4px}
.dir{font-size:.86rem;margin-top:3px}
.ft{color:var(--good)} .live{color:var(--bad);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.84rem} td,th{padding:5px 4px;border-bottom:1px solid var(--border);text-align:left}
</style>
</head>
<body>
<div class="wrap">
<h1>馬會亞指 · 即時賽程／動向</h1>
<p class="meta" id="meta">載入中… · <a href="./index.html">主板</a></p>
<div id="app"></div>
</div>
<script>
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&','<':'<','>':'>'}[c]));}
function lineTxt(r){
  const line=Number(r.line);
  if(!Number.isFinite(line)) return '盤口 —';
  const role=Math.abs(line)<1e-9?'平手':(line<0?'主讓':'主受');
  const mag=String(Math.abs(line)).replace(/\.0$/,'');
  let s=role+' '+mag+'　主水 '+(r.home_water??'—')+'　客水 '+(r.away_water??'—');
  if(r.live_line!=null) s+='　場中盤 '+r.live_line+' '+(r.live_home_water??'')+'/'+(r.live_away_water??'')+'（不入票）';
  return s;
}
function card(r, live){
  return '<div class="card"><div class="row"><span class="ko">'+esc(r.ko)+'</span><span class="fb">'+esc(r.fb)+'</span></div>'
    +'<div><b>'+esc(r.home)+'</b> vs '+esc(r.away)+(live?' <span class="live">已開賽</span>':'')+'</div>'
    +'<div class="line">'+esc(lineTxt(r))+'</div>'
    +'<div class="mv">動向：'+esc(r.move||'')+'</div>'
    +'<div class="dir"><b>【鳴人】</b> '+esc(r.naruto)+'</div>'
    +'<div class="dir"><b>【鹿丸】</b> '+esc(r.shikamaru)+'</div>'
    +'<div class="dir"><b>【跟盤建議】</b> '+esc(r.tip)+'</div></div>';
}
fetch('./board_live.json?ts='+Date.now()).then(r=>r.json()).then(b=>{
  document.getElementById('meta').innerHTML='更新：'+esc(b.updated_at_hkt)+' · 即將 '+(b.upcoming||[]).length+'／已開賽 '+(b.in_play||[]).length+'／已完結 '+(b.settled_today||[]).length+' · 層1 v28 · 鹿丸只抄 tickets.json · <a href="./index.html">主板</a><br>'+esc(b.note||'');
  const rows=(b.settled_today||[]).map(r=>'<tr><td>'+esc(r.ko)+'</td><td>'+esc(r.fb||'')+' '+esc(r.home)+' vs '+esc(r.away)+'</td><td class="ft">'+esc(r.score||'—')+'</td><td>'+esc(r.old_ticket||'—')+'</td></tr>').join('');
  document.getElementById('app').innerHTML=
    '<h2>即將（未開賽 '+(b.upcoming||[]).length+'）</h2>'+(b.upcoming||[]).map(r=>card(r,false)).join('')
    +'<h2>已開賽（'+(b.in_play||[]).length+'）</h2>'+((b.in_play||[]).map(r=>card(r,true)).join('')||'<p class="meta">無</p>')
    +'<h2>已完結（'+(b.settled_today||[]).length+'）</h2><table><tr><th>開賽</th><th>比賽</th><th>大分</th><th>舊票</th></tr>'+rows+'</table>'
    +'<p class="meta">點球不入大分。查唔到 FT 留已開賽，唔捏造。已開賽不改票。</p>';
}).catch(e=>{document.getElementById('app').textContent='讀唔到 board_live.json：'+e;});
</script>
</body>
</html>
