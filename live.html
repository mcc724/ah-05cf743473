<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>鳴人專案 賽程／動向 Live</title>
<style>
body { font-family: sans-serif; background:#111; color:#eee; }
.card { border:1px solid #444; margin:8px; padding:10px; border-radius:6px; background:#222; }
h2 { color:#4af; }
</style>
</head>
<body>
<h1>鳴人專案 Live 板 2026-11-16 23:15 HKT</h1>
<p>即將 / 已開賽 / 已完結。鹿丸全缺，暫跟鳴人。場中分不入分析。已開不改舊票。</p>
<div id="app"></div>
<script>
fetch('board_live.json').then(r=>r.json()).then(data => {
  const app = document.getElementById('app');
  [['upcoming','即將'],['live','已開賽'],['finished','已完結']].forEach(([k,title]) => {
    const arr = data[k] || [];
    if (!arr.length) return;
    const h = document.createElement('h2');
    h.textContent = title + ' (' + arr.length + ')';
    app.appendChild(h);
    arr.forEach(m => {
      const d = document.createElement('div');
      d.className = 'card';
      d.innerHTML = `<b>${m.time} ${m.fb}</b> ${m.home} vs ${m.away}<br>盤口 ${m.line} 主水 ${m.home_w} / 客水 ${m.away_w} 動向：${m.trend}<br>【鳴人】${m.naruto} (conf ${m.conf}%)<br>【鹿丸】${m.deer}<br>【跟盤建議】${m.suggest}`;
      app.appendChild(d);
    });
  });
});
</script>
</body>
</html>
