<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>鳴人專案 賽程／動向 Live</title>
<style>
body { font-family: Arial, sans-serif; background:#111; color:#eee; }
.card { border:1px solid #444; margin:10px; padding:10px; border-radius:8px; background:#222; }
.time { color:#0f0; }
.dir { font-weight:bold; color:#ff0; }
.miss { color:#f66; }
</style>
</head>
<body>
<h1>鳴人專案 即將賽事（暫代更新 2026-11-24 21:15 HKT）</h1>
<p>公開板：https://mcc724.github.io/ah-05cf743473/live.html</p>
<div id="cards"></div>
<script>
fetch('board_live.json').then(r=>r.json()).then(data=>{
  const c = document.getElementById('cards');
  data.upcoming.forEach(m=>{
    c.innerHTML += `<div class="card">
      <div class="time">${m.date} ${m.time} ${m.fb}</div>
      <div>${m.home} vs ${m.away}</div>
      <div>盤口 ${m.line_home} ${m.h_water} / ${m.line_away} ${m.a_water}　動向：${m.trend}</div>
      <div class="dir">【鳴人】${m.naruto}（${m.conf}% ${m.note}）</div>
      <div class="miss">【鹿丸】${m.shika}</div>
      <div>【跟盤建議】${m.follow}</div>
    </div>`;
  });
});
</script>
</body>
</html>
