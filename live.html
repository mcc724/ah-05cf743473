<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>鳴人暫代賽程 /live.html</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;margin:20px}
.card{border:1px solid #444;padding:12px;margin:10px;border-radius:8px;background:#222}
.up{border-left:4px solid #4caf50}
.live{border-left:4px solid #ff9800}
.fin{border-left:4px solid #9e9e9e}
h2{color:#aaa}
.naruto{color:#4fc3f7;font-weight:bold}
</style>
</head>
<body>
<h1>鳴人暫代 HKJC 讓球賽程／動向 2026-11-12 21:15 HKT</h1>
<p>公開: <a href="https://mcc724.github.io/ah-05cf743473/live.html">live.html</a> | 實盤只跟【鳴人】| 鹿丸全缺暫跟鳴人</p>
<div id="content"></div>
<script>
fetch('board_live.json').then(r=>r.json()).then(data=>{
  const c=document.getElementById('content');
  function render(title, arr, cls){
    if(!arr||!arr.length) return;
    c.innerHTML += `<h2>${title} (${arr.length})</h2>`;
    arr.forEach(m=>{
      c.innerHTML += `<div class="card ${cls}">
        <b>${m.time}</b> ${m.fb} ${m.home} vs ${m.away}<br>
        盤 ${m.line} 主水${m.home_w} / 客水${m.away_w} 動向:${m.trend}<br>
        <span class="naruto">【鳴人】${m.naruto} (${m.conf}%)</span><br>
        【鹿丸】${m.deer}<br>
        【跟盤建議】${m.suggest}
        ${m.score ? '<br>比分:'+m.score : ''}
      </div>`;
    });
  }
  render('即將', data.upcoming, 'up');
  render('已開賽', data.in_progress, 'live');
  render('已完結', data.finished, 'fin');
});
</script>
</body>
</html>
