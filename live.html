<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>鳴人專案 賽程／動向</title>
<style>
body { font-family: sans-serif; background:#111; color:#eee; padding:10px; }
.card { border:1px solid #444; margin:8px; padding:10px; border-radius:6px; background:#222; }
h2 { color:#4af; }
</style>
</head>
<body>
<h1>鳴人專案 live 賽程</h1>
<div id="meta"></div>
<h2>即將</h2><div id="upcoming"></div>
<h2>已開賽</h2><div id="live"></div>
<h2>已完結</h2><div id="finished"></div>
<script>
fetch('board_live.json').then(r=>r.json()).then(data=>{
  document.getElementById('meta').textContent = '更新：' + data.updated;
  function render(id, list) {
    const el = document.getElementById(id);
    el.innerHTML = list.map(m => `
      <div class="card">
        <b>${m.ko}</b> ${m.fb} ${m.home} vs ${m.away}<br>
        盤：${m.line} 水：${m.water} 動向：${m.movement}<br>
        【鳴人】${m.naruto} (${m.conf}%) ${m.note||''}<br>
        【鹿丸】${m.shikamaru}<br>
        【跟盤建議】${m.suggest}
        ${m.score ? '<br>比分：'+m.score+' '+m.status : ''}
      </div>
    `).join('');
  }
  render('upcoming', data.upcoming||[]);
  render('live', data.live||[]);
  render('finished', data.finished||[]);
});
</script>
</body>
</html>
