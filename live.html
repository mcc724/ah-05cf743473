<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>馬會亞指即時賽程</title>
<!-- updated 2026-10-08 18:06 HKT board_live.json stamp 08/10/2026 18:05. no CNAME. -->
<style>
body{margin:0;background:#0e141b;color:#e8eef6;font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif}
header{padding:16px 18px 8px}
h1{margin:0;font-size:20px}
.sub{color:#9ab;font-size:13px;margin-top:4px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
section h2{margin:0 0 8px;font-size:16px}
.card{background:#17202b;border:1px solid #2a3848;border-radius:10px;padding:10px 12px;margin:0 0 10px}
.tt{font-size:16px}
.ln,.mv,.meta{color:#9ab;font-size:12px;margin-top:2px}
.mv{color:#d7c48a}
a{color:#8ec8ff}
</style>
</head>
<body>
<header>
<h1>馬會亞指即時賽程</h1>
<div class="sub" id="sub">載入 board_live.json</div>
<div class="sub"><a href="https://mcc724.github.io/ah-05cf743473/live.html">live.html</a></div>
</header>
<div class="cols" id="cols"></div>
<script>
function esc(s){return String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function side(line){if(line<0)return "主讓 "+line; if(line>0)return "主受 +"+line; return "平手 0";}
function card(m, done){
  if(done){
    return `<article class="card"><div class="tt"><b>${esc(m.home)}</b> vs ${esc(m.away)}</div><div class="ln">FT ${esc(m.ft)}</div><div class="mv">${esc(m.note)}</div><div>【鳴人】${esc(m.naruto)}</div><div>【鹿丸】${esc(m.shikamaru)}</div><div>【跟盤建議】${esc(m.tip)}</div><div class="meta">${esc(m.ko)} · 已完結 · ${esc(m.fb)}</div></article>`;
  }
  return `<article class="card"><div class="tt"><b>${esc(m.home)}</b> vs ${esc(m.away)}</div><div class="ln">${esc(m.lg)} · ${side(m.line)} · 主水 ${esc(m.hw)}／客水 ${esc(m.aw)}</div><div class="mv">${esc(m.move)}</div><div>【鳴人】${esc(m.nar)}</div><div>【鹿丸】${esc(m.shika)}</div><div>【跟盤建議】${esc(m.tip)}</div><div class="meta">${esc(m.ko)} · ${esc(m.status)} · ${esc(m.fb)} · ${esc(m.meta)}</div></article>`;
}
fetch("board_live.json?t="+Date.now()).then(r=>r.json()).then(b=>{
  const c=b.counts||{};
  document.getElementById("sub").textContent=`更新 ${b.updated_hkt} HKT · ${b.page_stamp||""} · branch master · 即將 ${c["即將"]}／已開賽 ${c["已開賽"]}／已完結 ${c["已完結"]} · ${b.note||""}`;
  document.getElementById("cols").innerHTML=
    `<section><h2>即將（${c["即將"]}）</h2>${(b.upcoming||[]).map(m=>card(m,false)).join("")}</section>`+
    `<section><h2>已開賽（${c["已開賽"]}）</h2>${(b.live||[]).map(m=>card(m,false)).join("")}</section>`+
    `<section><h2>已完結（${c["已完結"]}）</h2>${(b.finished||[]).map(m=>card(m,true)).join("")}</section>`;
}).catch(e=>{document.getElementById("sub").textContent="讀 board_live.json 失敗 "+e;});
</script>
</body>
</html>
