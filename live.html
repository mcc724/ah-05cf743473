<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>鳴人專案 賽程／動向</title>
<style>
body { font-family: sans-serif; background:#111; color:#eee; padding:10px; }
h1 { color:#0f0; }
.section { margin:20px 0; }
.card { border:1px solid #444; margin:8px 0; padding:8px; background:#222; border-radius:6px; }
.fb { color:#0af; font-weight:bold; }
.naruto { color:#f80; }
.suggest { color:#0f0; }
.score { color:#ff0; }
</style>
</head>
<body>
<h1>鳴人專案 賽程／動向 <span id="updated"></span></h1>
<div class="section"><h2>即將</h2><div id="upcoming"></div></div>
<div class="section"><h2>已開賽</h2><div id="inprogress"></div></div>
<div class="section"><h2>已完結</h2><div id="finished"></div></div>
<script>
fetch('board_live.json').then(r=>r.json()).then(data=>{
  document.getElementById('updated').textContent = data.updated;
  function render(id, list){
    const el = document.getElementById(id);
    el.innerHTML = list.map(m => `
      <div class="card">
        <div><span class="fb">${m.fb}</span> ${m.ko} ${m.home} vs ${m.away}</div>
        <div>盤口 ${m.line} 水位 ${m.water} 動向 ${m.movement}</div>
        ${m.score ? `<div class="score">比分 ${m.score}</div>` : ''}
        <div class="naruto">【鳴人】${m.naruto}</div>
        <div>【鹿丸】${m.shikamaru}</div>
        <div class="suggest">【跟盤建議】${m.suggest}</div>
      </div>
    `).join('');
  }
  render('upcoming', data.upcoming||[]);
  render('inprogress', data.inprogress||[]);
  render('finished', data.finished||[]);
});
</script>
</body>
</html>
