<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>鳴人專案 賽程／動向 Live</title>
<style>
body { font-family: sans-serif; background:#111; color:#eee; }
.card { border:1px solid #444; margin:10px; padding:10px; background:#222; }
.naruto { color:#0f0; font-weight:bold; }
.deer { color:#fa0; }
.suggest { color:#0af; }
</style>
</head>
<body>
<h1>鳴人專案 暫代 Live Board</h1>
<p>更新: 2026-11-09 17:15 HKT | <a href="board_live.json">JSON</a></p>
<div id="upcoming"></div>
<script>
fetch('board_live.json').then(r=>r.json()).then(data => {
  const u = document.getElementById('upcoming');
  u.innerHTML = '<h2>即將 (' + data.upcoming.length + ')</h2>';
  data.upcoming.forEach(m => {
    u.innerHTML += `<div class="card">
      <b>${m.time} ${m.home} vs ${m.away}</b> (${m.fb})<br>
      盤: ${m.line} 主水 ${m.home_w} / 客水 ${m.away_w} | 動向: ${m.trend}<br>
      <span class="naruto">【鳴人】${m.naruto} (${m.conf}%)</span><br>
      <span class="deer">【鹿丸】${m.deer}</span><br>
      <span class="suggest">【跟盤建議】${m.suggest}</span>
    </div>`;
  });
  u.innerHTML += '<h2>已開賽 (0)</h2><h2>已完結 (0)</h2>';
});
</script>
</body>
</html>
