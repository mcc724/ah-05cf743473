<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<title>馬會亞指 · 即時賽程／動向</title>
<style>
:root{--bg:#0f1419;--card:#1a2332;--text:#e7ecf3;--muted:#8b9bb4;--accent:#3d8bfd;--good:#3dd68c;--warn:#f5a524;--bad:#f07178;--border:#2a3a52}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 48px}
h1{font-size:1.2rem;margin:0 0 6px}h2{font-size:1rem;margin:18px 0 8px}
.meta{color:var(--muted);font-size:.82rem;margin:0 0 12px}a{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin:0 0 10px}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ko{color:var(--warn);font-weight:700}.fb{color:var(--muted);font-size:.78rem}
.line{font-size:.95rem;margin-top:6px}.mv{font-size:.82rem;color:var(--muted);margin-top:4px}
.ft{color:var(--good)}.live{color:var(--bad);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.84rem}td,th{padding:5px 4px;border-bottom:1px solid var(--border);text-align:left}
</style>
</head>
<body>
<div class="wrap">
<h1>馬會亞指 · 即時賽程／動向</h1>
<p class="meta" id="meta">讀取中… · <a href="./">返回主板</a></p>
<p class="meta">場中分不入分析、不改票。新場欠截圖不出新票。</p>
<div id="app"></div>
</div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c]))}
function card(m, extra){
  return '<div class="card"><div class="row"><span class="ko">'+esc(m.ko)+'</span><span class="fb">'+esc(m.fb||'')+(extra||'')+'</span></div><div><b>'+esc(m.home)+'</b> vs '+esc(m.away)+'</div>'
    +(m.line_pre!=null?'<div class="line">賽前尾 '+esc(m.line_pre)+' 　'+esc(m.home_water_pre)+' / '+esc(m.away_water_pre)+'</div>':'')
    +(m.line_live!=null?'<div class="line">即場現盤 '+esc(m.line_live)+' 　'+esc(m.home_water_live)+' / '+esc(m.away_water_live)+'（不入分析）</div>':'')
    +(m.line!=null?'<div class="line">'+esc(m.line)+' 　'+esc(m.home_water)+' / '+esc(m.away_water)+'</div>':'')
    +'<div class="mv">'+esc(m.move||'')+(m.old_ticket?' · 舊票：'+esc(m.old_ticket):'')+'</div></div>';
}
fetch('board_live.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById('meta').innerHTML='更新：'+esc(d.updated_at_hkt)+' · 三欄：即將 '+(d.upcoming||[]).length+' / 已開 '+(d.in_play||[]).length+' / 已完 '+(d.settled_today||[]).length+' · <a href="./">返回主板</a>';
  let h='<h2>即將（未開賽）</h2>';
  (d.upcoming||[]).forEach(m=>h+=card(m));
  h+='<h2>已開賽（進行中，未完場）</h2>';
  if(!(d.in_play||[]).length) h+='<p class="meta">無</p>';
  (d.in_play||[]).forEach(m=>h+=card(m,' · <span class="live">'+esc(m.period||'進行中')+'</span>'));
  h+='<h2>已完結</h2><table><tr><th>開賽</th><th>場</th><th>FT</th><th>舊板票</th></tr>';
  (d.settled_today||[]).forEach(m=>h+='<tr><td>'+esc(m.ko||'')+'</td><td>'+esc(m.home)+' vs '+esc(m.away)+'</td><td class="ft">'+esc(m.score||'')+'</td><td>'+esc(m.old_ticket||'')+'</td></tr>');
  h+='</table>';
  document.getElementById('app').innerHTML=h;
}).catch(()=>{document.getElementById('app').textContent='讀取 board_live.json 失敗';});
</script>
</body>
</html>
