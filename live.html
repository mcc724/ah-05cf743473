<!DOCTYPE html>
<html lang="zh-HK">
<head><meta charset="UTF-8"><title>Live Board 2026-10-12 16:10</title>
<style>body{font-family:sans-serif;margin:20px} .card{border:1px solid #ccc;padding:10px;margin:10px;border-radius:8px} .dir{font-weight:bold;color:#0066cc}</style>
</head>
<body>
<h1>\u8cfd\u7a0b\uff0f\u52d5\u5411 \u66f4\u65b0 2026-10-12 16:10 HKT</h1>
<p>\u4f86\u6e90\u99ac\u6703 hdc\u3002\u6bcf\u5361\u542b\u76e4\u53e3\u6c34\u4f4d\uff0b\u52d5\u5411\uff0c\u3010\u9cf4\u4eba\u3011\u3010\u9e7f\u4e38\u3011\u3010\u8ddf\u76e4\u5efa\u8b70\u3011\u3002\u7981\u6b62\u91cd\u5efa CNAME\u3002</p>
<div id="content"></div>
<script>
fetch('board_live.json').then(r=>r.json()).then(d=>{
  let html = '<h2>\u5373\u5c07 ('+d.upcoming.length+')</h2>';
  d.upcoming.forEach(m=>{
    html += `<div class=\"card\">
      <strong>${m.time} ${m.home} vs ${m.away}</strong> (${m.league||''}) ${m.fb}<br>
      \u76e4\u53e3: ${m.h_home} ${m.w_home} / ${m.h_away} ${m.w_away}<br>
      \u52d5\u5411: ${m.movement}<br>
      <span class=\"dir\">\u3010\u9cf4\u4eba\u3011 ${m.naruto}</span><br>
      \u3010\u9e7f\u4e38\u3011 ${m.shikamaru}<br>
      \u3010\u8ddf\u76e4\u5efa\u8b70\u3011 ${m.suggest}
    </div>`;
  });
  html += '<h2>\u5df2\u958b\u8cfd ('+d.live.length+')</h2>';
  d.live.forEach(m=>{
    html += `<div class=\"card\">
      <strong>${m.time} ${m.home} vs ${m.away}</strong> ${m.fb} \u6bd4\u5206:${m.score||'\u2014'} ${m.status||''}<br>
      <span class=\"dir\">\u3010\u9cf4\u4eba\u3011 ${m.naruto||'\u2014'}</span><br>
      \u3010\u9e7f\u4e38\u3011 ${m.shikamaru||'\u2014'}<br>
      \u3010\u8ddf\u76e4\u5efa\u8b70\u3011 ${m.suggest||'\u2014'}<br>
      ${m.note||''}
    </div>`;
  });
  html += '<h2>\u5df2\u5b8c\u7d50 ('+ (d.finished?d.finished.length:0) +')</h2>';
  (d.finished||[]).forEach(m=>{
    html += `<div class=\"card\">
      <strong>${m.time} ${m.home} vs ${m.away}</strong> ${m.fb} \u5b8c\u5834 ${m.score}<br>
      <span class=\"dir\">\u3010\u9cf4\u4eba\u3011 ${m.naruto||'\u2014'}</span><br>
      \u3010\u9e7f\u4e38\u3011 ${m.shikamaru||'\u2014'}<br>
      \u3010\u8ddf\u76e4\u5efa\u8b70\u3011 ${m.suggest||'\u2014'}<br>
      ${m.note||''}
    </div>`;
  });
  document.getElementById('content').innerHTML = html;
});
</script>
</body>
</html>
