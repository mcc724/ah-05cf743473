<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>鳴人暫代賽程 live</title>
<style>
body { font-family: sans-serif; background:#111; color:#eee; }
.card { border:1px solid #444; margin:8px; padding:10px; border-radius:6px; background:#222; }
.naruto { color:#ffaa00; font-weight:bold; }
.deer { color:#88ccff; }
.suggest { color:#aaffaa; }
.trend { color:#ff8888; }
</style>
</head>
<body>
<h1>鳴人暫代 HKJC 賽程／動向 <span id="updated"></span></h1>
<div id="upcoming"></div>
<div id="live"></div>
<div id="finished"></div>
<script>
fetch('board_live.json').then(r=>r.json()).then(data => {
  document.getElementById('updated').textContent = data.updated;
  function render(id, list, title) {
    const el = document.getElementById(id);
    el.innerHTML = `<h2>${title} (${list.length})</h2>`;
    list.forEach(m => {
      el.innerHTML += `<div class="card">
        <b>${m.time} ${m.fb}</b> ${m.home} vs ${m.away}<br>
        盤 ${m.line} 主水 ${m.home_w} / 客水 ${m.away_w}<br>
        <span class="trend">動向: ${m.trend}</span><br>
        <span class="naruto">【鳴人】${m.naruto} (${m.conf}%)</span><br>
        <span class="deer">【鹿丸】${m.deer}</span><br>
        <span class="suggest">【跟盤建議】${m.suggest}</span>
      </div>`;
    });
  }
  render('upcoming', data.upcoming||[], '即將');
  render('live', data.live||[], '已開賽');
  render('finished', data.finished||[], '已完結');
});
</script>
</body>
</html>
