<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>馬會亞指即時賽程</title>
<style>
body{margin:0;background:#0e141b;color:#e8eef6;font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif}
header{padding:16px 18px 8px}h1{margin:0;font-size:20px}.sub{color:#9ab;font-size:13px;margin-top:4px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
section h2{margin:0 0 8px;font-size:16px}
.card{background:#17202b;border:1px solid #2a3848;border-radius:10px;padding:10px 12px;margin:0 0 10px}
.tt{font-size:16px}.ln,.mv,.meta{color:#9ab;font-size:12px;margin-top:2px}.mv{color:#d7c48a}a{color:#8ec8ff}
</style></head><body>
<header><h1>馬會亞指即時賽程</h1>
<div class="sub" id="sub">載入中</div>
<div class="sub">馬會頁 06/10/2026 13:11。南韓 FT 2-0、沙特U20 FT 0-0。中國仍已開賽，舊票不改。即場分不入。08/10 未納入。禁止重建 CNAME。</div>
<div class="sub">重出：埃及仍讓 −0.25（46.9%）；阿塞拜疆仍受 +2.25（33.3%）；法國U21仍受 +1（42.5%）；愛爾蘭改讓英格蘭 −1（53.0%）；美國仍受加拿大 +0.75（55.9% 備注薄）。</div>
<div class="sub"><a href="https://mcc724.github.io/ah-05cf743473/live.html">live.html</a></div>
</header>
<div class="cols">
<section><h2 id="h1">即將</h2><div id="up"></div></section>
<section><h2 id="h2">已開賽</h2><div id="lv"></div></section>
<section><h2 id="h3">已完結</h2><div id="fn"></div></section>
</div>
<script>
fetch("board_live.json?v=2111").then(r=>r.json()).then(b=>{
  document.getElementById("sub").textContent="更新 "+b.updated_hkt+" HKT · bet.hkjc.com/ch/football/hdc · branch master · 即將 "+b.counts["即將"]+"／已開賽 "+b.counts["已開賽"]+"／已完結 "+b.counts["已完結"];
  document.getElementById("h1").textContent="即將（"+b.upcoming.length+"）";
  document.getElementById("h2").textContent="已開賽（"+b.live.length+"）";
  document.getElementById("h3").textContent="已完結（"+b.finished.length+"）";
  const card=(t,extra)=>'<article class="card"><div class="tt"><b>'+t.home+'</b> vs '+t.away+'</div>'+extra+'</article>';
  document.getElementById("up").innerHTML=b.upcoming.map(m=>card(m,
    '<div class="ln">'+(m.lg||"")+' · 盤 '+m.line+' · 主水 '+m.hw+'／客水 '+m.aw+'</div><div class="mv">'+(m.move||"")+'</div><div>【鳴人】'+(m.nar||"")+'</div><div>【鹿丸】'+(m.shika||"缺")+'</div><div>【跟盤建議】'+(m.tip||"")+'</div><div class="meta">'+m.ko+' · 即將 · '+m.fb+' · '+(m.meta||"")+'</div>')).join("");
  document.getElementById("lv").innerHTML=b.live.map(m=>card(m,
    '<div class="ln">'+(m.lg||"")+' · 賽前盤 '+m.line+' · 主水 '+m.hw+'／客水 '+m.aw+'</div><div class="mv">'+(m.move||"")+'</div><div>【鳴人】'+(m.nar||"")+'</div><div>【鹿丸】'+(m.shika||"缺")+'</div><div>【跟盤建議】'+(m.tip||"")+'</div><div class="meta">'+m.ko+' · 已開賽 · '+m.fb+'</div>')).join("");
  document.getElementById("fn").innerHTML=b.finished.map(m=>card(m,
    '<div class="ln">完場 '+(m.ft||"")+'</div><div class="mv">'+(m.note||"")+'</div><div>【鳴人】'+(m.naruto||"")+'</div><div>【鹿丸】'+(m.shikamaru||"缺")+'</div><div>【跟盤建議】'+(m.tip||"")+'</div><div class="meta">'+(m.ko||"")+' · 已完結 · '+m.fb+'</div>')).join("");
}).catch(e=>{document.getElementById("sub").textContent="載入失敗 "+e;});
</script></body></html>
