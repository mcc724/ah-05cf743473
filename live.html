<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>鳴人專案 賽程／動向 Live</title>
<style>
body { font-family: sans-serif; background:#111; color:#eee; padding:10px; }
h1 { color:#0f0; }
.col { display:inline-block; vertical-align:top; width:32%; margin:0.5%; background:#222; padding:10px; border-radius:8px; }
.card { background:#333; margin:8px 0; padding:8px; border-left:4px solid #0f0; }
.card.live { border-left-color:#f80; }
.card.done { border-left-color:#888; }
.fb { color:#0af; font-weight:bold; }
.naruto { color:#0f0; font-weight:bold; }
.suggest { color:#ff0; }
.trend { color:#aaa; font-size:0.9em; }
</style>
</head>
<body>
<h1>鳴人專案 賽程／動向 <span id="upd"></span></h1>
<p>公開: <a href="https://mcc724.github.io/ah-05cf743473/live.html" style="color:#0af">live.html</a> | 實盤只跟【鳴人】 鹿丸缺暫跟鳴人</p>
<div id="app"></div>
<script>
fetch('board_live.json?t='+Date.now()).then(r=>r.json()).then(data=>{
  document.getElementById('upd').textContent = data.updated_at || '';
  const app = document.getElementById('app');
  const cols = [
    {key:'upcoming', title:'即將 (KO未到)', cls:''},
    {key:'in_progress', title:'已開賽 (進行中)', cls:'live'},
    {key:'finished', title:'已完結', cls:'done'}
  ];
  cols.forEach(c=>{
    const div = document.createElement('div');
    div.className = 'col';
    div.innerHTML = `<h2>${c.title} (${(data[c.key]||[]).length})</h2>`;
    (data[c.key]||[]).forEach(g=>{
      const card = document.createElement('div');
      card.className = 'card ' + c.cls;
      card.innerHTML = `
        <div class="fb">${g.fb} ${g.ko}</div>
        <div>${g.match}</div>
        <div>${g.line} <span class="trend">${g.trend||''}</span></div>
        <div class="naruto">【鳴人】 ${g.naruto||''}</div>
        <div>【鹿丸】 ${g.shikamaru||'缺'}</div>
        <div class="suggest">【跟盤建議】 ${g.suggest||''}</div>
      `;
      div.appendChild(card);
    });
    app.appendChild(div);
  });
}).catch(e=>{
  document.getElementById('app').innerHTML = '<p>載入失敗: '+e+'</p>';
});
</script>
</body>
</html>
