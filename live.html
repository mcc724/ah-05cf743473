<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>鳴人專案 賽程／動向 Live</title>
<style>
body { font-family: system-ui, sans-serif; background:#111; color:#eee; margin:20px; }
h1 { color:#f90; }
.section { margin:20px 0; }
.card { background:#222; border:1px solid #444; border-radius:8px; padding:12px; margin:8px 0; }
.fb { color:#0af; font-weight:bold; }
.trend { color:#0f0; }
.naruto { color:#f90; font-weight:bold; }
.shika { color:#aaa; }
.suggest { color:#0f0; }
.ko { color:#ccc; }
</style>
</head>
<body>
<h1>鳴人專案 賽程／動向 (暫代)</h1>
<p>更新時間: <span id="updated"></span></p>
<div class="section"><h2>即將</h2><div id="upcoming"></div></div>
<div class="section"><h2>已開賽</h2><div id="in_progress"></div></div>
<div class="section"><h2>已完結</h2><div id="finished"></div></div>
<script>
fetch('board_live.json')
  .then(r => r.json())
  .then(data => {
    document.getElementById('updated').textContent = data.updated_at;
    function render(arr, id) {
      const el = document.getElementById(id);
      el.innerHTML = arr.map(m => `
        <div class="card">
          <div class="ko">${m.ko} <span class="fb">${m.fb}</span></div>
          <div>${m.match}</div>
          <div>盤口 ${m.line} 主水 ${m.wh} 客水 ${m.wa} 動向 <span class="trend">${m.trend}</span></div>
          <div class="naruto">【鳴人】${m.naruto}</div>
          <div class="shika">【鹿丸】${m.shikamaru}</div>
          <div class="suggest">【跟盤建議】${m.suggest}</div>
        </div>
      `).join('') || '<p>無</p>';
    }
    render(data.upcoming, 'upcoming');
    render(data.in_progress, 'in_progress');
    render(data.finished, 'finished');
  })
  .catch(e => document.body.innerHTML += '<p>載入失敗</p>');
</script>
</body>
</html>
